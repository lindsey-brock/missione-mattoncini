<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- dark badge background -->
  <rect x="0" y="0" width="100" height="100" rx="22" fill="#0D1B2A"/>
  <!-- outer glow rim -->
  <rect x="0" y="0" width="100" height="100" rx="22" fill="none" stroke="#7EDCCA" stroke-width="4" opacity="0.35"/>

  <!-- rocket body -->
  <rect x="36" y="26" width="28" height="40" rx="14" fill="#F5C842" stroke="#0D1B2A" stroke-width="2"/>
  <!-- nose cone -->
  <path d="M36 38 Q50 10 64 38Z" fill="#F5C842" stroke="#0D1B2A" stroke-width="2" stroke-linejoin="round"/>
  <!-- nose highlight -->
  <path d="M43 34 Q50 15 56 30" stroke="#FFE080" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.7"/>
  <!-- window -->
  <circle cx="50" cy="48" r="8" fill="#1A2E45" stroke="#0D1B2A" stroke-width="1.5"/>
  <circle cx="50" cy="48" r="6" fill="#0a1420"/>
  <circle cx="47.5" cy="45.5" r="2.2" fill="#7EDCCA" opacity="0.85"/>
  <!-- left fin -->
  <path d="M36 52 L22 72 L36 68Z" fill="#E03A2F" stroke="#0D1B2A" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- right fin -->
  <path d="M64 52 L78 72 L64 68Z" fill="#E03A2F" stroke="#0D1B2A" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- nozzle -->
  <path d="M40 66 Q50 72 60 66 L58 76 Q50 80 42 76Z" fill="#1A2E45" stroke="#0D1B2A" stroke-width="1.5"/>
  <!-- flame outer -->
  <path d="M43 76 Q40 90 50 100 Q60 90 57 76 Q53 84 50 86 Q47 84 43 76Z" fill="#F5C842"/>
  <!-- flame mid -->
  <path d="M46 78 Q44 88 50 97 Q56 88 54 78 Q52 84 50 86 Q48 84 46 78Z" fill="#FFE080"/>
  <!-- flame core -->
  <path d="M48 81 Q47.5 86 50 92 Q52.5 86 52 81 Q51 84 50 85 Q49 84 48 81Z" fill="#FFF5CC"/>
</svg>
