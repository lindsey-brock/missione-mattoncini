<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="glow" cx="78%" cy="28%" r="45%">
      <stop offset="0%" stop-color="#7EDCCA" stop-opacity="0.11"/>
      <stop offset="100%" stop-color="#0D1B2A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- background -->
  <rect width="1200" height="630" fill="#0D1B2A"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- stars -->
  <circle cx="80"  cy="60"  r="2"   fill="#F8F6F0" opacity="0.5"/>
  <circle cx="200" cy="110" r="1.5" fill="#F8F6F0" opacity="0.32"/>
  <circle cx="460" cy="40"  r="2"   fill="#F8F6F0" opacity="0.42"/>
  <circle cx="640" cy="170" r="1.5" fill="#F8F6F0" opacity="0.28"/>
  <circle cx="820" cy="90"  r="2"   fill="#F8F6F0" opacity="0.38"/>
  <circle cx="980" cy="165" r="1.5" fill="#F8F6F0" opacity="0.32"/>
  <circle cx="140" cy="200" r="1.2" fill="#F8F6F0" opacity="0.28"/>
  <circle cx="330" cy="155" r="1"   fill="#F8F6F0" opacity="0.22"/>
  <circle cx="1100" cy="280" r="1.5" fill="#F8F6F0" opacity="0.25"/>
  <circle cx="760" cy="520" r="1.2" fill="#F8F6F0" opacity="0.22"/>
  <circle cx="900" cy="480" r="1"   fill="#F8F6F0" opacity="0.18"/>
  <circle cx="90"  cy="480" r="1.2" fill="#F8F6F0" opacity="0.2"/>
  <circle cx="1050" cy="80" r="1"   fill="#F8F6F0" opacity="0.3"/>
  <!-- 4-pointed stars -->
  <path d="M80 60 l2 5 l5 2 l-5 2 l-2 5 l-2-5 l-5-2 l5-2Z"    fill="#F8F6F0" opacity="0.5"/>
  <path d="M460 40 l2 4 l4 2 l-4 2 l-2 4 l-2-4 l-4-2 l4-2Z"   fill="#F8F6F0" opacity="0.42"/>
  <path d="M820 90 l2 5 l5 2 l-5 2 l-2 5 l-2-5 l-5-2 l5-2Z"   fill="#F8F6F0" opacity="0.38"/>

  <!-- ── ROCKET (large, centred at ~960, 260) ── -->
  <!-- scale ≈ 3× the original 60×90 rocket; translate so centre = (960,260) -->
  <g transform="translate(900,160)">
    <!-- body -->
    <rect x="22" y="16" width="56" height="78" rx="28" fill="#F5C842"/>
    <!-- nose cone -->
    <path d="M22 44 Q50 -8 78 44Z" fill="#F5C842"/>
    <!-- window shine -->
    <path d="M30 40 Q50 4 66 38" stroke="#FFF5CC" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.65"/>
    <!-- porthole -->
    <circle cx="50" cy="64" r="18" fill="#1A2E45"/>
    <circle cx="50" cy="64" r="14" fill="#0D1B2A"/>
    <circle cx="44" cy="58" r="5"  fill="#7EDCCA" opacity="0.9"/>
    <!-- thruster dots -->
    <circle cx="34" cy="86" r="6" fill="#E03A2F" opacity="0.9"/>
    <circle cx="50" cy="86" r="6" fill="#E03A2F" opacity="0.9"/>
    <circle cx="66" cy="86" r="6" fill="#E03A2F" opacity="0.9"/>
    <!-- fins -->
    <path d="M22 76 L-8 114 L22 104Z" fill="#E03A2F"/>
    <path d="M78 76 L108 114 L78 104Z" fill="#E03A2F"/>
    <!-- nozzle shroud -->
    <path d="M26 96 Q50 108 74 96 L70 114 Q50 122 30 114Z" fill="#1A2E45"/>
    <!-- flame -->
    <path d="M30 114 Q18 140 50 162 Q82 140 70 114 Q62 130 50 134 Q38 130 30 114Z" fill="#F5C842"/>
    <path d="M34 117 Q26 138 50 158 Q74 138 66 117 Q59 132 50 134 Q41 132 34 117Z" fill="#FFE080"/>
    <path d="M40 122 Q36 140 50 154 Q64 140 60 122 Q55 134 50 134 Q45 134 40 122Z" fill="#FFF5CC"/>
  </g>

  <!-- brand name -->
  <text x="60" y="300"
    font-family="'Arial Black', 'Arial Bold', Impact, sans-serif"
    font-weight="900"
    font-size="138"
    fill="#F8F6F0"
    letter-spacing="-3">MISSIONE</text>
  <text x="60" y="450"
    font-family="'Arial Black', 'Arial Bold', Impact, sans-serif"
    font-weight="900"
    font-size="138"
    fill="#F5C842"
    letter-spacing="-3">MATTONCINI</text>

  <!-- tagline -->
  <text x="62" y="512"
    font-family="Arial, sans-serif"
    font-weight="300"
    font-size="26"
    fill="#7EDCCA"
    letter-spacing="2.5">Costruiamo. Esploriamo. Impariamo.</text>

  <!-- bottom stripe -->
  <rect x="0" y="622" width="720" height="8" fill="#E03A2F"/>
  <rect x="720" y="622" width="480" height="8" fill="#F5C842"/>
</svg>
